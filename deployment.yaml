apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy

spec:
  replicas: 3

  selector:
    matchLabels:
      name: cloudtech

  template:
    metadata:
      labels:
        name: cloudtech

    spec:
      serviceAccountName: cloudtech-sa
      containers:
      - name: cloudtech-container
        image: 900840136675.dkr.ecr.ap-south-1.amazonaws.com/cloudtech:38
        imagePullPolicy: Always

        ports:
        - containerPort: 3000

        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: cloudtech-secret
              key: DB_HOST

        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: cloudtech-secret
              key: DB_PORT

        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: cloudtech-secret
              key: DB_NAME

        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: cloudtech-secret
              key: DB_USER

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cloudtech-secret
              key: DB_PASSWORD